<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mary's House — IT Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --teal:#3AAFC4; --magenta:#C4237A; --ink:#1a2630; --bg:#f4f7f8; --line:#e2e8ea;
         --low:#2e9e6b; --medium:#d99400; --high:#d1483c; --critical:#C4237A; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); display:flex; height:100vh; }
  /* sidebar */
  aside{ width:220px; background:var(--ink); color:#cdd8dd; flex:none; display:flex; flex-direction:column; padding:18px 12px; }
  aside .brand{ display:flex; align-items:center; gap:10px; padding:6px 8px 18px; }
  aside .brand .logo{ width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,var(--teal),var(--magenta)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; }
  aside .brand b{ color:#fff; font-size:14px; } aside .brand small{ display:block; font-size:11px; opacity:.6; }
  nav button{ width:100%; text-align:left; background:none; border:none; color:#cdd8dd; font-family:inherit; font-size:14px; padding:11px 12px; border-radius:9px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  nav button:hover{ background:rgba(255,255,255,.06); }
  nav button.active{ background:var(--teal); color:#fff; }
  nav button .count{ font-size:11px; background:rgba(255,255,255,.2); border-radius:20px; padding:1px 7px; }
  aside .status{ margin-top:auto; font-size:11px; padding:8px; border-radius:8px; background:rgba(255,255,255,.05); }
  aside .status .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:#d1483c; margin-right:5px; }
  aside .status.live .dot{ background:#2e9e6b; }
  /* main */
  main{ flex:1; overflow-y:auto; padding:26px 30px; }
  h2{ font-size:20px; margin-bottom:2px; } .sub{ color:#6a7a82; font-size:13px; margin-bottom:20px; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:22px; }
  .stat{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat .n{ font-size:26px; font-weight:700; } .stat .l{ font-size:12px; color:#6a7a82; margin-top:2px; }
  .toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  select,.btn{ font-family:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px; padding:8px 11px; background:#fff; cursor:pointer; }
  .btn.danger{ color:#d1483c; border-color:#f0c9c5; } .btn.teal{ background:var(--teal); color:#fff; border:none; }
  table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th,td{ text-align:left; padding:11px 13px; font-size:13.5px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:#8a97a0; background:#fafbfc; }
  tr:last-child td{ border-bottom:none; }
  .ref{ font-family:'DM Mono',monospace; color:var(--magenta); font-weight:500; }
  .badge{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; color:#fff; text-transform:capitalize; }
  .badge.low{ background:var(--low); } .badge.medium{ background:var(--medium); }
  .badge.high{ background:var(--high); } .badge.critical{ background:var(--critical); }
  .pill{ font-size:11px; padding:3px 9px; border-radius:20px; background:#eef2f3; color:#4a5a63; text-transform:capitalize; }
  .expand{ cursor:pointer; color:var(--teal); font-weight:600; user-select:none; }
  .detail td{ background:#fafbfc; font-size:13px; }
  .detail .block{ margin-bottom:8px; } .detail .block b{ display:block; font-size:11px; text-transform:uppercase; color:#8a97a0; margin-bottom:2px; }
  .empty{ text-align:center; color:#8a97a0; padding:40px; font-size:14px; }
  .statusdd{ padding:5px 8px; font-size:12.5px; }
  /* notifications */
  .rule{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .rule .top{ display:flex; justify-content:space-between; align-items:center; }
  .rule .rp{ display:flex; align-items:center; gap:10px; font-weight:600; text-transform:capitalize; }
  textarea.recip{ width:100%; margin-top:10px; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-family:inherit; font-size:13px; min-height:52px; }
  .switch{ position:relative; width:42px; height:24px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:#ccd6da; border-radius:24px; transition:.2s; cursor:pointer; }
  .slider:before{ content:''; position:absolute; height:18px; width:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  input:checked + .slider{ background:var(--teal); } input:checked + .slider:before{ transform:translateX(18px); }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .bar-row .lbl{ width:90px; font-size:12.5px; text-transform:capitalize; color:#4a5a63; }
  .bar-row .track{ flex:1; background:#eef2f3; border-radius:6px; height:22px; overflow:hidden; }
  .bar-row .fill{ height:100%; background:linear-gradient(90deg,var(--teal),var(--magenta)); border-radius:6px; }
  .bar-row .v{ width:36px; text-align:right; font-size:12.5px; font-weight:600; }
  .settings-box{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; max-width:640px; margin-bottom:16px; }
  .settings-box h3{ font-size:15px; margin-bottom:8px; } .settings-box p{ font-size:13px; color:#6a7a82; line-height:1.5; }
  .kv{ font-family:'DM Mono',monospace; font-size:12.5px; background:#f4f7f8; padding:8px 10px; border-radius:7px; margin-top:8px; word-break:break-all; }
  .tag{ font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600; }
  .tag.ok{ background:#e3f4ec; color:#2e9e6b; } .tag.no{ background:#fbe9e7; color:#d1483c; }
  .hide{ display:none; }
  aside.app-view,main.app-view{ display:none; }
  aside.app-view.active{ display:flex; }
  main.app-view.active{ display:block; }
  #login-screen{ position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(145deg,#edf5f7,#f9eef4); }
  #login-screen.hide{ display:none; }
  .login-card{ width:min(410px,100%); background:#fff; border:1px solid var(--line); border-radius:18px; padding:30px; box-shadow:0 18px 55px rgba(26,38,48,.13); }
  .login-brand{ display:flex; align-items:center; gap:12px; margin-bottom:24px; }
  .login-logo{ width:44px; height:44px; border-radius:11px; background:linear-gradient(135deg,var(--teal),var(--magenta)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; }
  .login-card h1{ font-size:22px; }
  .login-card p{ color:#6a7a82; font-size:13px; line-height:1.5; margin-top:3px; }
  .login-card label{ display:block; font-size:12px; font-weight:700; margin:14px 0 6px; }
  .login-card input{ width:100%; border:1px solid var(--line); border-radius:9px; padding:11px 12px; font:inherit; font-size:14px; }
  .login-card input:focus{ outline:2px solid rgba(58,175,196,.25); border-color:var(--teal); }
  .login-card button{ width:100%; margin-top:18px; padding:11px; border:0; border-radius:9px; background:var(--teal); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  .login-card button:disabled{ opacity:.6; cursor:wait; }
  #login-error{ min-height:19px; margin-top:12px; color:#d1483c; font-size:12.5px; }
  .user-box{ margin-top:auto; padding:10px 8px; border-top:1px solid rgba(255,255,255,.09); }
  .user-box b,.user-box small{ display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .user-box b{ color:#fff; font-size:12px; }
  .user-box small{ font-size:10.5px; opacity:.65; margin-top:2px; }
  .signout{ margin-top:9px; width:100%; border:1px solid rgba(255,255,255,.2); background:transparent; color:#cdd8dd; border-radius:7px; padding:7px; font:inherit; font-size:11px; cursor:pointer; }
</style>
</head>
<body>
<section id="login-screen">
  <form class="login-card" id="login-form">
    <div class="login-brand">
      <div class="login-logo">IT</div>
      <div><h1>IT Dashboard</h1><p>Mary's House Services</p></div>
    </div>
    <p>Sign in with your authorised IT account.</p>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" autocomplete="username" required>
    <label for="login-password">Password</label>
    <input id="login-password" type="password" autocomplete="current-password" required>
    <button id="login-button" type="submit">Sign in</button>
    <div id="login-error" role="alert"></div>
  </form>
</section>

<aside class="app-view">
  <div class="brand"><div class="logo">IT</div><div><b>IT Dashboard</b><small>Mary's House</small></div></div>
  <nav>
    <button data-tab="cases" class="active">Cases <span class="count" id="c-cases">0</span></button>
    <button data-tab="notifications">Notifications</button>
    <button data-tab="insights">Insights</button>
    <button data-tab="supplies">Supplies <span class="count" id="c-supplies">0</span></button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="user-box">
    <b id="user-name">Signed in</b>
    <small id="user-role"></small>
    <button class="signout" id="signout" type="button">Sign out</button>
  </div>
  <div class="status" id="conn"><span class="dot"></span><span id="conn-t">Connecting…</span></div>
</aside>
<main id="main" class="app-view"></main>

<script>
const CONFIG = {
  SUPABASE_URL:     'https://dmkwylzpjjqwnmnmyevr.supabase.co',
  SUPABASE_ANON_KEY:'sb_publishable_ETFl2bqi-QdO_TsLYhwE_A_TTKbdc09'
};
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

let cases=[], orders=[], queries=[], rules=[], emailLog=[];
let tab='cases', fStatus='all', fPriority='all';
const expanded=new Set();
let lastSeen=null;
let dashboardStarted=false, pollTimer=null, realtimeChannel=null;

function showLogin(message=''){
  document.getElementById('login-screen').classList.remove('hide');
  document.querySelectorAll('.app-view').forEach(el=>el.classList.remove('active'));
  document.getElementById('login-error').textContent=message;
}

async function stopDashboard(){
  dashboardStarted=false;
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  if(realtimeChannel){ await sb.removeChannel(realtimeChannel); realtimeChannel=null; }
  cases=[]; orders=[]; queries=[]; rules=[]; emailLog=[];
  showLogin();
}

async function startDashboard(user){
  if(dashboardStarted) return;

  const { data:staff, error }=await sb.from('staff')
    .select('full_name,email,role')
    .eq('id',user.id)
    .single();

  if(error || !staff || !['it_admin','it_team'].includes(staff.role)){
    await sb.auth.signOut();
    showLogin('This account is not authorised for the IT dashboard.');
    return;
  }

  dashboardStarted=true;
  document.getElementById('login-screen').classList.add('hide');
  document.querySelectorAll('.app-view').forEach(el=>el.classList.add('active'));
  document.getElementById('user-name').textContent=staff.full_name||staff.email||'IT user';
  document.getElementById('user-role').textContent=staff.role.replace('_',' ');

  await loadAll();
  subscribe();
  pollTimer=setInterval(poll,2000);
}

// ── data load ──
async function loadAll(){
  const [c,o,q,r,e]=await Promise.all([
    sb.from('cases').select('*').order('created_at',{ascending:false}),
    sb.from('orders').select('*').order('created_at',{ascending:false}),
    sb.from('queries').select('*').order('created_at',{ascending:false}),
    sb.from('notification_rules').select('*'),
    sb.from('email_log').select('*').order('created_at',{ascending:false})
  ]);
  if(c.error){ setConn(false,c.error.message); return; }
  cases=c.data||[]; orders=o.data||[]; queries=q.data||[]; rules=r.data||[]; emailLog=e.data||[];
  const newest=cases[0]?cases[0].created_at:null; lastSeen=newest;
  setConn(true); render();
}
function setConn(ok,msg){
  const el=document.getElementById('conn'); el.className='status'+(ok?' live':'');
  document.getElementById('conn-t').textContent = ok ? 'Live · synced' : ('Offline — '+(msg||'check CONFIG'));
}

// ── realtime + 2s poll fallback ──
function subscribe(){
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel=sb.channel('rt-all')
    .on('postgres_changes',{event:'*',schema:'public',table:'cases'},loadAll)
    .on('postgres_changes',{event:'*',schema:'public',table:'orders'},loadAll)
    .on('postgres_changes',{event:'*',schema:'public',table:'queries'},loadAll)
    .subscribe();
}
async function poll(){
  const { data, error }=await sb.from('cases').select('created_at').order('created_at',{ascending:false}).limit(1);
  if(error){ setConn(false,error.message); return; }
  const newest=data&&data[0]?data[0].created_at:null;
  if(newest!==lastSeen){ lastSeen=newest; loadAll(); }
}

// ── render router ──
function render(){
  document.getElementById('c-cases').textContent=cases.filter(c=>c.status!=='resolved').length;
  document.getElementById('c-supplies').textContent=orders.filter(o=>o.status!=='delivered').length;
  const views={cases:renderCases,notifications:renderNotifications,insights:renderInsights,supplies:renderSupplies,settings:renderSettings};
  document.getElementById('main').innerHTML=views[tab]();
  if(tab==='cases') wireCases();
  if(tab==='notifications') wireNotifications();
  if(tab==='supplies') wireSupplies();
  if(tab==='settings') wireSettings();
}
const esc=s=>(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const timeAgo=iso=>{ const d=(Date.now()-new Date(iso))/1000; if(d<60)return'just now'; if(d<3600)return Math.floor(d/60)+'m ago'; if(d<86400)return Math.floor(d/3600)+'h ago'; return Math.floor(d/86400)+'d ago'; };

// ── CASES ──
function renderCases(){
  const open=cases.filter(c=>c.status==='open').length;
  const prog=cases.filter(c=>c.status==='in-progress').length;
  const hot=cases.filter(c=>c.priority==='high'||c.priority==='critical').length;
  let list=cases.filter(c=>(fStatus==='all'||c.status===fStatus)&&(fPriority==='all'||c.priority===fPriority));
  let rows=list.length?list.map(c=>{
    const open=expanded.has(c.id);
    let r=`<tr>
      <td class="ref">${c.ref}</td>
      <td>${esc(c.summary)}</td>
      <td><span class="pill">${c.category}</span></td>
      <td><span class="badge ${c.priority}">${c.priority}</span></td>
      <td>
        <select class="statusdd" data-id="${c.id}">
          ${['open','in-progress','resolved'].map(s=>`<option value="${s}" ${c.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td>${timeAgo(c.created_at)}</td>
      <td><span class="expand" data-exp="${c.id}">${open?'Hide':'View'}</span></td>
    </tr>`;
    if(open){
      r+=`<tr class="detail"><td colspan="7">
        <div class="block"><b>Description</b>${esc(c.detail)||'—'}</div>
        <div class="block"><b>Already tried</b>${esc(c.tried)||'—'}</div>
        <div class="block"><b>What IT needs to do</b>${esc(c.required)||'—'}</div>
      </td></tr>`;
    }
    return r;
  }).join(''):`<tr><td colspan="7"><div class="empty">No cases match.</div></td></tr>`;
  return `<h2>Cases</h2><div class="sub">Support tickets from the chatbot, live.</div>
    <div class="cards">
      <div class="stat"><div class="n">${cases.length}</div><div class="l">Total</div></div>
      <div class="stat"><div class="n">${open}</div><div class="l">Open</div></div>
      <div class="stat"><div class="n">${prog}</div><div class="l">In progress</div></div>
      <div class="stat"><div class="n">${hot}</div><div class="l">High / Critical</div></div>
    </div>
    <div class="toolbar">
      <select id="fStatus">${['all','open','in-progress','resolved'].map(s=>`<option ${fStatus===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="fPriority">${['all','critical','high','medium','low'].map(s=>`<option ${fPriority===s?'selected':''}>${s}</option>`).join('')}</select>
      <button class="btn danger" id="clearCases">Clear all cases</button>
    </div>
    <table><thead><tr><th>Ref</th><th>Summary</th><th>Category</th><th>Priority</th><th>Status</th><th>Logged</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}
function wireCases(){
  document.querySelectorAll('[data-exp]').forEach(el=>el.onclick=()=>{ const id=el.getAttribute('data-exp'); expanded.has(id)?expanded.delete(id):expanded.add(id); render(); });
  document.querySelectorAll('.statusdd').forEach(el=>el.onchange=async()=>{
    const id=el.getAttribute('data-id');
    const { error }=await sb.from('cases').update({status:el.value}).eq('id',id);
    if(error) alert('Update failed: '+error.message); else loadAll();
  });
  const fs=document.getElementById('fStatus'), fp=document.getElementById('fPriority');
  if(fs) fs.onchange=()=>{ fStatus=fs.value; render(); };
  if(fp) fp.onchange=()=>{ fPriority=fp.value; render(); };
  const cc=document.getElementById('clearCases');
  if(cc) cc.onclick=async()=>{ if(!confirm('Delete ALL cases? This cannot be undone.'))return;
    const { error }=await sb.from('cases').delete().not('id','is',null);
    if(error) alert('Clear failed: '+error.message); else loadAll();
  };
}

// ── NOTIFICATIONS ──
function renderNotifications(){
  const order=['critical','high','medium','low'];
  const ruleFor=p=>rules.find(r=>r.priority===p)||{priority:p,email_enabled:true,teams_enabled:true,recipients:[]};
  const ruleCards=order.map(p=>{ const r=ruleFor(p);
    return `<div class="rule">
      <div class="top">
        <div class="rp"><span class="badge ${p}">${p}</span> email alerts</div>
        <label class="switch"><input type="checkbox" data-toggle="${p}" ${r.email_enabled?'checked':''}><span class="slider"></span></label>
      </div>
      <textarea class="recip" data-recip="${p}" placeholder="Recipient emails, comma-separated">${(r.recipients||[]).join(', ')}</textarea>
    </div>`;
  }).join('');
  const logRows=emailLog.length?emailLog.map(l=>`<tr>
      <td class="ref">${l.case_ref||'—'}</td>
      <td><span class="badge ${l.priority||'low'}">${l.priority||'—'}</span></td>
      <td>${l.suppressed?'<span class="tag no">suppressed by rule</span>':'<span class="tag ok">'+(l.email_status||'—')+'</span>'}</td>
      <td>${l.teams_status||'—'}</td>
      <td>${timeAgo(l.created_at)}</td>
    </tr>`).join(''):`<tr><td colspan="5"><div class="empty">No notifications sent yet. Delivery is wired up in Phase 5 (Power Automate / Edge Function trigger) — these rules are read by that step.</div></td></tr>`;
  return `<h2>Notifications</h2><div class="sub">Per-priority alert rules. Saved to Supabase; delivery runs in Phase 5.</div>
    <div style="max-width:640px">${ruleCards}
    <button class="btn teal" id="saveRules" style="margin-top:4px">Save rules</button></div>
    <h3 style="margin:26px 0 10px;font-size:15px">Send log</h3>
    <table><thead><tr><th>Case</th><th>Priority</th><th>Email</th><th>Teams</th><th>When</th></tr></thead><tbody>${logRows}</tbody></table>`;
}
function wireNotifications(){
  const btn=document.getElementById('saveRules');
  if(btn) btn.onclick=async()=>{
    const order=['critical','high','medium','low'];
    const rows=order.map(p=>({
      priority:p,
      email_enabled:document.querySelector(`[data-toggle="${p}"]`).checked,
      recipients:document.querySelector(`[data-recip="${p}"]`).value.split(',').map(s=>s.trim()).filter(Boolean)
    }));
    const { error }=await sb.from('notification_rules').upsert(rows,{onConflict:'priority'});
    if(error) alert('Save failed: '+error.message); else { await loadAll(); btn.textContent='Saved ✓'; setTimeout(()=>btn.textContent='Save rules',1500); }
  };
}

// ── INSIGHTS ──
function renderInsights(){
  const total=queries.length;
  const escalated=cases.length;
  const byCat={};
  queries.forEach(q=>{ const k=q.category||'uncategorised'; byCat[k]=(byCat[k]||0)+1; });
  const entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const top=entries[0]?entries[0][0]:'—';
  const max=entries[0]?entries[0][1]:1;
  const bars=entries.length?entries.map(([k,v])=>`<div class="bar-row"><div class="lbl">${k}</div><div class="track"><div class="fill" style="width:${Math.round(v/max*100)}%"></div></div><div class="v">${v}</div></div>`).join(''):'<div class="empty">No queries logged yet.</div>';
  const recent=queries.slice(0,10).map(q=>`<tr><td>${esc(q.summary||q.message)}</td><td><span class="pill">${q.category||'—'}</span></td><td>${timeAgo(q.created_at)}</td></tr>`).join('')||'<tr><td colspan="3"><div class="empty">Nothing yet.</div></td></tr>';
  return `<h2>Insights</h2><div class="sub">What staff are asking — and how much never needed a ticket.</div>
    <div class="cards">
      <div class="stat"><div class="n">${total}</div><div class="l">Total queries</div></div>
      <div class="stat"><div class="n">${total}</div><div class="l">Self-resolved</div></div>
      <div class="stat"><div class="n">${escalated}</div><div class="l">Escalated to ticket</div></div>
      <div class="stat"><div class="n" style="text-transform:capitalize">${top}</div><div class="l">Top category</div></div>
    </div>
    <div class="settings-box"><h3>Queries by category</h3>${bars}</div>
    <h3 style="margin:6px 0 10px;font-size:15px">Recent self-resolved</h3>
    <table><thead><tr><th>Query</th><th>Category</th><th>When</th></tr></thead><tbody>${recent}</tbody></table>`;
}

// ── SUPPLIES ──
function renderSupplies(){
  const stages=['pending','approved','ordered','delivered'];
  const counts=stages.map(s=>orders.filter(o=>o.status===s).length);
  const rows=orders.length?orders.map(o=>`<tr>
      <td>${esc(o.item)}</td>
      <td>${esc(o.site)||'—'}</td>
      <td><select class="statusdd" data-order="${o.id}">${stages.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
      <td>${timeAgo(o.created_at)}</td>
    </tr>`).join(''):'<tr><td colspan="4"><div class="empty">No supply orders yet.</div></td></tr>';
  return `<h2>Supplies</h2><div class="sub">Consumable & peripheral requests from the chatbot.</div>
    <div class="cards">
      ${stages.map((s,i)=>`<div class="stat"><div class="n">${counts[i]}</div><div class="l" style="text-transform:capitalize">${s}</div></div>`).join('')}
    </div>
    <table><thead><tr><th>Item</th><th>Site</th><th>Status</th><th>Requested</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function wireSupplies(){
  document.querySelectorAll('[data-order]').forEach(el=>el.onchange=async()=>{
    const id=el.getAttribute('data-order');
    const patch={status:el.value}; if(el.value==='approved') patch.approved_at=new Date().toISOString();
    const { error }=await sb.from('orders').update(patch).eq('id',id);
    if(error) alert('Update failed: '+error.message); else loadAll();
  });
}

// ── SETTINGS ──
function renderSettings(){
  const connected=!CONFIG.SUPABASE_URL.includes('YOUR-PROJECT');
  return `<h2>Settings</h2><div class="sub">Connection & configuration.</div>
    <div class="settings-box">
      <h3>Supabase ${connected?'<span class="tag ok">configured</span>':'<span class="tag no">not configured</span>'}</h3>
      <p>The dashboard and chatbot both read/write this project. Fill the CONFIG block at the top of each HTML file.</p>
      <div class="kv">${esc(CONFIG.SUPABASE_URL)}</div>
      <button class="btn teal" id="testConn" style="margin-top:12px">Test connection</button>
      <span id="testResult" style="margin-left:10px;font-size:13px"></span>
    </div>
    <div class="settings-box">
      <h3>Notification delivery <span class="tag no">Phase 5</span></h3>
      <p>Email (EmailJS) and Teams (Incoming Webhook) sending isn't wired in this build — it moves server-side in Phase 5 so nothing fires from a browser tab. The per-priority rules on the Notifications tab are already saved and will be read by that step. When you're ready, a Supabase trigger → Power Automate flow sends on each new case.</p>
    </div>
    <div class="settings-box">
      <h3>Access <span class="tag ok">login enabled</span></h3>
      <p>The dashboard requires an authorised IT account. Development-only anonymous database policies must still be removed before deployment.</p>
    </div>`;
}
function wireSettings(){
  const btn=document.getElementById('testConn');
  if(btn) btn.onclick=async()=>{
    const r=document.getElementById('testResult'); r.textContent='Testing…';
    const { error }=await sb.from('cases').select('id').limit(1);
    r.innerHTML = error ? '<span class="tag no">'+esc(error.message)+'</span>' : '<span class="tag ok">Connected ✓</span>';
  };
}

// ── nav ──
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); tab=b.getAttribute('data-tab'); render();
});

// ── authentication ──
document.getElementById('login-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const button=document.getElementById('login-button');
  const errorBox=document.getElementById('login-error');
  const email=document.getElementById('login-email').value.trim();
  const password=document.getElementById('login-password').value;

  button.disabled=true; button.textContent='Signing in…'; errorBox.textContent='';
  const { data, error }=await sb.auth.signInWithPassword({email,password});
  button.disabled=false; button.textContent='Sign in';

  if(error){ errorBox.textContent=error.message; return; }
  if(data.user) startDashboard(data.user);
});

document.getElementById('signout').onclick=()=>sb.auth.signOut();

sb.auth.onAuthStateChange((event,session)=>{
  setTimeout(()=>{
    if(event==='SIGNED_OUT') stopDashboard();
    else if(session?.user) startDashboard(session.user);
  },0);
});

// ── boot ──
async function boot(){
  render();
  if(CONFIG.SUPABASE_URL.includes('YOUR-PROJECT')){
    showLogin('Fill in the CONFIG block before signing in.');
    return;
  }
  const { data:{ user } }=await sb.auth.getUser();
  if(user) startDashboard(user); else showLogin();
}
boot();
</script>
</body>
</html>
