<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mary's House — IT Support</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --teal:#3AAFC4; --magenta:#C4237A; --ink:#1a2630; --bg:#f4f7f8; --bot:#ffffff; --me:#3AAFC4; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header{ background:var(--ink); color:#fff; padding:16px 22px; display:flex; align-items:center; gap:12px; flex:none; }
  header .logo{ width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--teal),var(--magenta)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
  header h1{ font-size:16px; font-weight:700; }
  header p{ font-size:12px; opacity:.7; margin-top:1px; }
  #chat{ flex:1; overflow-y:auto; padding:24px 18px; display:flex; flex-direction:column; gap:16px; }
  .wrap{ max-width:760px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
  .row{ display:flex; gap:10px; align-items:flex-end; }
  .row.me{ flex-direction:row-reverse; }
  .avatar{ width:32px; height:32px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; }
  .avatar.bot{ background:var(--magenta); }
  .avatar.me{ background:var(--teal); }
  .bubble{ padding:11px 15px; border-radius:16px; max-width:78%; font-size:14.5px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .bot .bubble{ background:var(--bot); border-bottom-left-radius:5px; }
  .me  .bubble{ background:var(--me); color:#fff; border-bottom-right-radius:5px; }
  .card{ background:#fff; border:1px solid #e2e8ea; border-left:4px solid var(--teal); border-radius:12px; padding:14px 16px; max-width:78%; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .card .ref{ font-family:'DM Mono',monospace; font-weight:500; color:var(--magenta); font-size:13px; }
  .card .note{ font-size:13px; margin-top:4px; color:#4a5a63; }
  .order-btn{ background:var(--teal); color:#fff; border:none; padding:10px 16px; border-radius:10px; font-family:inherit; font-size:13.5px; font-weight:500; cursor:pointer; margin-top:2px; }
  .order-btn:hover{ filter:brightness(.95); }
  .typing{ display:inline-flex; gap:4px; padding:14px 16px; }
  .typing span{ width:7px; height:7px; border-radius:50%; background:#b7c2c7; animation:blink 1.3s infinite both; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,60%,100%{ opacity:.25; } 30%{ opacity:1; } }
  footer{ flex:none; padding:14px 18px; background:#fff; border-top:1px solid #e2e8ea; }
  .composer{ max-width:760px; margin:0 auto; display:flex; gap:10px; }
  #input{ flex:1; border:1px solid #d5dee1; border-radius:12px; padding:12px 15px; font-family:inherit; font-size:14.5px; resize:none; max-height:120px; }
  #input:focus{ outline:none; border-color:var(--teal); }
  #send{ background:var(--ink); color:#fff; border:none; border-radius:12px; padding:0 20px; font-family:inherit; font-weight:500; cursor:pointer; }
  #send:disabled{ opacity:.4; cursor:default; }
  .modal-bg{ position:fixed; inset:0; background:rgba(20,30,38,.5); display:none; align-items:center; justify-content:center; z-index:10; }
  .modal{ background:#fff; border-radius:16px; padding:24px; width:90%; max-width:420px; }
  .modal h3{ font-size:16px; margin-bottom:14px; }
  .modal label{ font-size:12.5px; color:#4a5a63; display:block; margin:10px 0 4px; }
  .modal input{ width:100%; border:1px solid #d5dee1; border-radius:9px; padding:10px 12px; font-family:inherit; font-size:14px; }
  .modal .actions{ display:flex; gap:10px; margin-top:18px; }
  .modal .actions button{ flex:1; padding:11px; border-radius:9px; border:none; font-family:inherit; font-weight:500; cursor:pointer; }
  .modal .cancel{ background:#eef2f3; }
  .modal .confirm{ background:var(--teal); color:#fff; }
  .banner{ background:#fff4e5; color:#8a5a00; font-size:12.5px; padding:8px 18px; text-align:center; flex:none; display:none; }
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<header>
  <div class="logo">IT</div>
  <div><h1>IT Support</h1><p>Mary's House Services</p></div>
</header>
<div id="chat"><div class="wrap" id="wrap"></div></div>
<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="What's going on? Describe your issue…"></textarea>
    <button id="send">Send</button>
  </div>
</footer>

<div class="modal-bg" id="orderModal">
  <div class="modal">
    <h3>Order supplies</h3>
    <label>What do you need?</label>
    <input id="orderItem" placeholder="e.g. TN-2450 toner">
    <label>Which site?</label>
    <input id="orderSite" placeholder="e.g. Refuge Site A">
    <div class="actions">
      <button class="cancel" onclick="closeOrder()">Cancel</button>
      <button class="confirm" onclick="submitOrder()">Submit request</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
//  CONFIG — fill in the Supabase project URL and publishable key.
//  The Claude API key stays securely in Supabase Edge Functions.
// ══════════════════════════════════════════════════════════
const CONFIG = {
  SUPABASE_URL:     'https://dmkwylzpjjqwnmnmyevr.supabase.co',
  SUPABASE_ANON_KEY:'sb_publishable_ETFl2bqi-QdO_TsLYhwE_A_TTKbdc09'
};

// ── system prompt (persona + triage + knowledge base) ──
const SYSTEM_PROMPT = `You are Alex, an IT support person at Mary's House Services. You're friendly, warm and casual — like a helpful colleague, not a robot. You're part of the IT team.

MARY'S HOUSE SERVICES — IT KNOWLEDGE BASE

ORGANISATION
Mary's House Services is a small NFP in Western Sydney supporting domestic violence survivors and refugees.
CRM: ClientTrack at clienttrack.maryshouse.org.au. Microsoft 365 (Outlook, Teams, SharePoint), Cisco AnyConnect VPN.

EQUIPMENT BY SITE
- Refuge Site A: 3x HP laptops, Brother MFC-L2750DW printer (toner TN-2450, drum DR-2425), Telstra NBN
- Refuge Site B: 2x Dell desktops, HP LaserJet printer, TPG
- Community Centre: 4x Lenovo laptops, Epson projector, no printer

You know the full house knowledge base covering: passwords/logins, printers, laptops/desktops, Outlook, Teams, SharePoint/OneDrive, internet/VPN, projector, security and supplies. Give clear numbered steps drawn from standard fixes for these systems.

═══════════════════════════════════════════
TRIAGE RULES — READ CAREFULLY
═══════════════════════════════════════════
YOUR DEFAULT IS TO SOLVE IT, NOT LOG IT. Most issues do not need a ticket. Fix it in chat first.

── NEVER create a ticket for these (just help) ──
Password resets, Outlook sync/Working Offline/junk, Teams glitches/cache/mic/camera, OneDrive sync/file names, slow computer, printer offline/paper jam, WiFi dropping, MFA setup — anything the knowledge base has clear steps for.
For these: give your best attempt with clear numbered steps. If they say it didn't work, ask ONE targeted follow-up, then give a second more specific attempt. Only after two genuine attempts have failed should you consider a ticket.

── ALWAYS create a ticket immediately ──
Hardware physically broken (BSOD, won't power on, burning smell, cracked screen, clicking drive); data/security incident (ransomware, lost/stolen device, client data exposed, clicked suspicious email, account compromise); complete site-wide outage; anything physically needing IT on-site.

── Create a ticket only after failed attempts ──
Software needing IT to install, SharePoint permissions, genuinely tried twice and still broken, user completely unable to work and self-service hasn't helped.

── If the user pushes back or insists on a ticket ──
Log it, no argument. Don't tell them the priority. Say it's logged, give the ref, tell them at least 24 hours, then still give them one more thing to try.

── Priority (INTERNAL — NEVER mention to staff) ──
CATEGORY OVERRIDES:
- password: ALWAYS low. No exceptions.
- hardware: low if peripheral with workaround; medium if a person's main computer unusable; high if multiple people at a site affected.
- software: low if workaround exists; medium if blocking a specific task with no workaround.
- network: medium if one person; high if site-wide outage.
- security: escalates per rules below.
General guide after overrides:
- critical: ransomware on screen, client data confirmed exposed/stolen, lost device with client records, active safeguarding risk.
- high: complete site-wide outage, confirmed account compromise.
- medium: one person significantly blocked no workaround, urgent software install.
- low: everything else.

── Ticket format ──
When creating a ticket, your ENTIRE response must be raw JSON only — no text before/after, no markdown fences:
{"action":"create_case","summary":"...","detail":"...","tried":"...","required":"...","priority":"low|medium|high|critical","category":"password|hardware|software|network|security|phone"}

── Tone ──
Never say "Certainly!", "Of course!", "Absolutely!", "Great question!" or any robotic filler. Never reveal you are an AI — you're part of the IT team. Ask only ONE question at a time. Be a helpful colleague, not a ticket machine.
If supplies are needed (toner, ink, paper, cables, drum unit, any consumable/peripheral), include [SHOW_ORDER_BUTTON] in your response.`;

// ── state ──
const wrap = document.getElementById('wrap');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let history = [];        // {role, content} for the API
let lastUserMsg = '';

// ── helpers ──
function scroll(){ const c=document.getElementById('chat'); c.scrollTop=c.scrollHeight; }
function banner(msg){ const b=document.getElementById('banner'); b.textContent=msg; b.style.display='block'; }

function addBubble(role, text){
  const row=document.createElement('div'); row.className='row '+(role==='me'?'me':'bot');
  const av=document.createElement('div'); av.className='avatar '+(role==='me'?'me':'bot'); av.textContent=role==='me'?'Me':'IT';
  const b=document.createElement('div'); b.className='bubble'; b.textContent=text;
  row.appendChild(av); row.appendChild(b); wrap.appendChild(row); scroll();
}
function addTyping(){
  const row=document.createElement('div'); row.className='row bot'; row.id='typing';
  const av=document.createElement('div'); av.className='avatar bot'; av.textContent='IT';
  const t=document.createElement('div'); t.className='bubble'; t.innerHTML='<span class="typing"><span></span><span></span><span></span></span>';
  row.appendChild(av); row.appendChild(t); wrap.appendChild(row); scroll();
}
function removeTyping(){ const t=document.getElementById('typing'); if(t) t.remove(); }

function addTicketCard(ref, urgent){
  const row=document.createElement('div'); row.className='row bot';
  const av=document.createElement('div'); av.className='avatar bot'; av.textContent='IT';
  const c=document.createElement('div'); c.className='card';
  c.innerHTML='<div class="ref">Ticket logged · '+ref+'</div><div class="note">'+
    (urgent?'The team will be onto it as soon as possible.':'The team will be in touch within 24 hours.')+'</div>';
  row.appendChild(av); row.appendChild(c); wrap.appendChild(row); scroll();
}
function addOrderButton(){
  const row=document.createElement('div'); row.className='row bot';
  const av=document.createElement('div'); av.className='avatar bot'; av.textContent='IT';
  const btn=document.createElement('button'); btn.className='order-btn'; btn.textContent='📦 Order supplies';
  btn.onclick=openOrder;
  row.appendChild(av); row.appendChild(btn); wrap.appendChild(row); scroll();
}

// ── category auto-detect for the query log ──
function detectCategory(text){
  const t=text.toLowerCase();
  const map=[
    ['password',['password','log in','login','locked','mfa','2fa','authenticator','sign in','sign-in']],
    ['security',['phishing','virus','suspicious','hacked','stolen','malware','pop-up','popup','breach','ransomware']],
    ['network', ['wifi','wi-fi','internet','vpn','anyconnect','network','connection','offline internet']],
    ['hardware',['printer','toner','drum','laptop','screen','keyboard','mouse','projector','monitor','battery','power','jam']],
    ['phone',   ['phone','mobile','call','headset']],
    ['software',['outlook','teams','sharepoint','onedrive','excel','word','install','software','update','app']]
  ];
  for(const [cat,kws] of map){ if(kws.some(k=>t.includes(k))) return cat; }
  return null;
}

// ── send validated writes through the server-side Edge Function ──
async function callSupport(action, payload){
  const res=await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/support-submit`,{
    method:'POST',
    headers:{
      'content-type':'application/json',
      'apikey':CONFIG.SUPABASE_ANON_KEY
    },
    body:JSON.stringify({action,payload})
  });

  let data={};
  try{ data=await res.json(); }catch(e){}

  if(!res.ok || data.error){
    throw new Error(data.error || `Request failed (${res.status})`);
  }
  return data;
}

// ── create a case in Supabase, return the generated ref ──
async function createCase(obj){
  const urgent = obj.priority==='critical' || obj.priority==='high';
  try{
    const data=await callSupport('create_case',{
      summary:obj.summary,
      detail:obj.detail||'',
      tried:obj.tried||'',
      required:obj.required||'',
      priority:obj.priority||'low',
      category:obj.category||'software',
      site:obj.site||''
    });
    addTicketCard(data.ref, urgent);
  }catch(error){
    banner('Could not log the ticket — '+error.message);
  }
}

// ── main send ──
async function send(){
  const text=input.value.trim(); if(!text) return;
  input.value=''; input.style.height='auto'; lastUserMsg=text;
  addBubble('me', text);

  // OVERRIDE: "lanna help" -> test case, no API
  if(text.toLowerCase().includes('lanna help')){
    addTyping();
    await createCase({ summary:'Test ticket (lanna help)', detail:'System test entry created from the chatbot.',
      tried:'n/a', required:'No action — test only.', priority:'low', category:'software' });
    removeTyping();
    return;
  }

  history.push({role:'user', content:text});
  sendBtn.disabled=true; addTyping();

  let replyText='';
  try{
    const res=await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/super-function`,{
      method:'POST',
      headers:{
        'content-type':'application/json',
        'apikey':CONFIG.SUPABASE_ANON_KEY
      },
      body:JSON.stringify({ system:SYSTEM_PROMPT, messages:history })
    });
    const data=await res.json();
    if(!res.ok || data.error){
      const message=typeof data.error==='string' ? data.error : data.error?.message;
      throw new Error(message||`Request failed (${res.status})`);
    }
    replyText=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
  }catch(e){
    removeTyping(); sendBtn.disabled=false;
    addBubble('bot',"I'm having trouble reaching the system right now — give it a moment and try again."); 
    banner('Claude API error: '+e.message);
    return;
  }
  removeTyping(); sendBtn.disabled=false;

  // ticket?
  const jsonMatch=replyText.replace(/```json|```/g,'').match(/\{[\s\S]*"action"\s*:\s*"create_case"[\s\S]*\}/);
  if(jsonMatch){
    let obj=null; try{ obj=JSON.parse(jsonMatch[0]); }catch(e){}
    if(obj && obj.action==='create_case'){
      history.push({role:'assistant', content:replyText});
      await createCase(obj);
      return;
    }
  }

  // normal reply
  const showOrder=replyText.includes('[SHOW_ORDER_BUTTON]');
  const clean=replyText.replace(/\[SHOW_ORDER_BUTTON\]/g,'').trim();
  addBubble('bot', clean);
  history.push({role:'assistant', content:replyText});
  if(showOrder) addOrderButton();

  // log self-resolved query (fire and forget)
  callSupport('create_query',{
    message:lastUserMsg,
    summary:lastUserMsg.slice(0,120),
    category:detectCategory(lastUserMsg)
  }).catch(error=>console.warn('query log failed',error.message));
}

// ── supply order modal ──
function openOrder(){ document.getElementById('orderModal').style.display='flex'; }
function closeOrder(){ document.getElementById('orderModal').style.display='none'; document.getElementById('orderItem').value=''; document.getElementById('orderSite').value=''; }
async function submitOrder(){
  const item=document.getElementById('orderItem').value.trim();
  const site=document.getElementById('orderSite').value.trim();
  if(!item){ document.getElementById('orderItem').focus(); return; }
  try{
    await callSupport('create_order',{item,site});
    closeOrder();
    addBubble('bot','Done — I\'ve put that supply request in. Your manager approves orders after 4 PM, then it goes to the supplier. Standard items usually land in 1–3 business days.');
  }catch(error){
    banner('Order could not be submitted: '+error.message);
  }
}
window.openOrder=openOrder; window.closeOrder=closeOrder; window.submitOrder=submitOrder;

// ── wiring ──
sendBtn.onclick=send;
input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }});
input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; });

// greeting
addBubble('bot',"Hey, I'm Alex from IT 👋 What's going on? Tell me what's playing up and I'll help sort it.");
if(CONFIG.SUPABASE_URL.includes('YOUR-PROJECT')) banner('⚠ Fill in the CONFIG block at the top of this file (Supabase URL + publishable key) before use.');
</script>
</body>
</html>
